
      - name: Locate and validate Android project
        shell: bash
        run: |
          echo "Repository root:"
          pwd

          echo "Files in repository:"
          ls -la

          echo "Searching for Gradle settings:"
          find . -maxdepth 5 \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print

          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "Android project found at repository root"
          else
            echo "::error::Android project not found at repository root"
            exit 1
          fi

          if [ ! -f app/build.gradle.kts ] && \
             [ ! -f app/build.gradle ]; then
            echo "::error::Android app module not found"
            exit 1
          fi

          echo "Project structure verified"
