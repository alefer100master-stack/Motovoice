
name: MotoVoice Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MotoVoice APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          PROJECT=""

          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            PROJECT="."
          else
            while IFS= read -r file; do
              dir=$(dirname "$file")

              if [ -f "$dir/app/build.gradle.kts" ] || \
                 [ -f "$dir/app/build.gradle" ]; then
                PROJECT="$dir"
                break
              fi
            done < <(find . -maxdepth 6 -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \))
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found"
            exit 1
          fi

          echo "Project found: $PROJECT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found"
            exit 1
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.project }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK not generated"
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload MotoVoice APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoVoice-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
