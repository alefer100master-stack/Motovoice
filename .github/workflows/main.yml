
name: MotoVoice Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build MotoVoice APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract MotoVoice ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="MotoVoice-GitHub.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::MotoVoice ZIP not found"
            exit 1
          fi

          mkdir -p android-project

          unzip -q -o "$ZIP" -d android-project

          echo "Project extracted successfully"
          ls -la android-project

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="android-project"

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          echo "Android project structure verified"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::SDK manager not found"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build MotoVoice APK
        shell: bash
        working-directory: android-project
        run: |
          set -euo pipefail

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          ls -lh "$APK"
          echo "MotoVoice APK build successful"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoVoice-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
